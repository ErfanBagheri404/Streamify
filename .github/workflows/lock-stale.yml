name: Lock Stale Threads
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 0
          exempt-issue-labels: "pinned,bug,enhancement,security"
          exempt-pr-labels: "pinned,do-not-close"
          operations-per-run: 100
