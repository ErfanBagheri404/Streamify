# Auto-label PRs by changed file paths
"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"
          - "LICENSE"
"config":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "tsconfig*"
          - "*.config.*"
