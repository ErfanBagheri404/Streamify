version: 2
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐞 Bug Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "📝 Documentation"
    labels:
      - "documentation"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "dependencies"
      - "github-actions"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
      - "enhancement"
      - "feature"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
      - "dependencies"
      - "documentation"
      - "chore"
  default: patch
template: |
  ## Changes
  $CHANGES
